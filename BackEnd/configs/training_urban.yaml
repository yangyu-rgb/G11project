seed: 42

scenario:
  type: urban
  directory: experiments/test_urban
  config: configs/scenarios/urban_intersection.yaml
  generate_if_missing: true

environment:
  episode_steps: 10
  max_vehicles: 100
  max_events: 3
  critical_radius_m: 300
  road_length_m: 5000
  lateral_extent_m: 500
  delay_normalization_ms: 100

network:
  mode: simple
  scenario: urban
  carrier_frequency_ghz: 5.9
  transmit_power_dbm: 23
  noise_floor_dbm: -94
  sinr_midpoint_db: 5
  sinr_scale_db: 2
  max_queue_delay_ms: 50

ppo:
  learning_rate: 0.0003
  clip_epsilon: 0.2
  entropy_coef: 0.01
  batch_size: 64
  n_epochs: 10
  n_steps: 64
  gamma: 0.99
  device: auto
  verbose: 1

evaluation_episodes: 5
