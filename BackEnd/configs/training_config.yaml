seed: 42

scenario:
  directory: experiments/test_scenario
  config: configs/scenarios/highway_emergency.yaml
  generate_if_missing: true

environment:
  episode_steps: 10
  max_vehicles: 50
  max_events: 2
  critical_radius_m: 300
  delay_normalization_ms: 100
  feature_mode: basic
  history_window: 5
  ttc_max_seconds: 30

reward:
  weights:
    effective_delivery: 0.25
    coverage: 0.30
    latency: 0.20
    overhead: 0.10
    missed: 0.10
    fairness: 0.05

network:
  mode: simple
  scenario: highway
  carrier_frequency_ghz: 5.9
  transmit_power_dbm: 23
  noise_floor_dbm: -94
  sinr_midpoint_db: 5
  sinr_scale_db: 2
  max_queue_delay_ms: 50

ppo:
  learning_rate: 0.0003
  clip_epsilon: 0.2
  entropy_coef: 0.01
  batch_size: 64
  n_epochs: 10
  n_steps: 64
  gamma: 0.99
  device: auto
  verbose: 1

evaluation_episodes: 5
