run_mode: formal
safety_window_ms: 100

base_scenario_configs:
  highway: configs/scenarios/highway_emergency.yaml
  urban: configs/scenarios/urban_intersection.yaml
models:
  highway: experiments/highway_batch/champion/model_best.zip
  urban: experiments/urban_batch/champion/model_best.zip

dataset:
  train_configs: 50
  validation_configs: 7
  test_configs: 10
test_seeds: [1701, 1801, 1901]

environment:
  episode_steps: 10
  max_vehicles: 100
  max_events: 3
  critical_radius_m: 300
  road_length_m: 5000
  delay_normalization_ms: 100

network:
  highway_mode: simple
  urban_mode: 3gpp
  carrier_frequency_ghz: 5.9
  transmit_power_dbm: 23
  noise_floor_dbm: -94
  sinr_midpoint_db: 5
  sinr_scale_db: 2
  max_queue_delay_ms: 50

reward_weights:
  effective_delivery: 0.25
  coverage: 0.30
  latency: 0.20
  overhead: 0.15
  missed: 0.10

