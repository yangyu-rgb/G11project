[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "g11project-backend"
version = "0.1.0"
description = "G11project backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "gymnasium>=0.29",
    "httpx>=0.28,<1.0",
    "numpy>=1.24",
    "pytest>=8.3,<9.0",
    "pyyaml>=6.0",
    "ruff>=0.8,<1.0",
    "stable-baselines3>=2.0",
    "sumolib",
    "tensorboard>=2.13",
    "torch>=2.0",
    "traci",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../Test"]

[tool.ruff]
line-length = 100
target-version = "py311"
